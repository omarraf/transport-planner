# Per-repo config for ticket-to-pr.
#
# Drop into the TARGET repo (transport-planner) at:
#   .ticket-to-pr/agent.yaml
#
# The workflow (.github/workflows/solve.yml) reads it via
# `--config .ticket-to-pr/agent.yaml`. Edit this file to change the model,
# budget, checks, or protected paths for THIS repo -- no tool changes needed.
#
# Model: litellm/glm-5.2 routed through your LiteLLM proxy (LITELLM_BASE_URL).
# The proxy URL + key + model_name come from repo secrets (LITELLM_BASE_URL,
# LITELLM_API_KEY, LITELLM_MODEL). The model id here MUST match the
# LITELLM_MODEL secret value (a model_name in your proxy's model_list).
# GLM-5.2 reasoning compat (thinkingFormat "zai", zaiToolStream, 1M ctx) is
# applied automatically from the model id -- see src/runner/litellm.ts.
version: 1
defaults:
  model: litellm/glm-5.2
  thinkingLevel: medium
  triggerLabel: agent
  budget:
    maxUsd: 5
    maxWallClockMinutes: 25
    maxTurns: 80
  draftPrOnFailure: true
repos:
  # transport-planner: two-package (backend + frontend) TypeScript repo.
  # HTTPS remote -> clone + push both use GITHUB_TOKEN (the PAT), no SSH needed.
  # backend has no test files, so the hard gate is `tsc` (build); lint is
  # non-blocking. frontend deps are installed so the agent can work in either
  # package; drop the frontend `setup` line for backend-only issues to go faster.
  - id: omarraf/transport-planner
    remote: https://github.com/omarraf/transport-planner.git
    baseBranch: main
    branchPrefix: agent/
    setup:
      - npm --prefix backend ci
      - npm --prefix frontend ci
    checks:
      - { name: backend-typecheck, cmd: "npm --prefix backend run build", required: true,  timeoutSec: 300 }
      - { name: backend-lint,      cmd: "npm --prefix backend run lint",  required: false, timeoutSec: 180 }
    protectedPaths:
      - ".github/workflows/**"
    prLabels:
      - agent-authored
    safeEnv: []
